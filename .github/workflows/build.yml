name: Build OlxiRoute APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Распаковать проект из .github/OlxiRoute.zip
        run: unzip -o -q .github/OlxiRoute.zip -d .

      - name: Обновить AGP и SDK
        run: |
          cat > build.gradle.kts <<'GRADLE'
          plugins {
              id("com.android.application") version "8.9.1" apply false
              kotlin("android") version "2.0.0" apply false
          }
          GRADLE
          sed -i 's/compileSdk = 34/compileSdk = 36/; s/targetSdk = 34/targetSdk = 36/' app/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: OlxiRoute-debug
          path: app/build/outputs/apk/debug/*.apk
